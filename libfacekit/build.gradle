plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.identixia.facerecognitionsdk.kit'
    compileSdk 34

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Engine types (FaceBox, FaceRecognitionSDK). App also depends on :libfacesdk / AAR via install.gradle.
    implementation project(':libfacesdk')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    def camerax = '1.4.2'
    api "androidx.camera:camera-core:$camerax"
    api "androidx.camera:camera-camera2:$camerax"
    api "androidx.camera:camera-lifecycle:$camerax"
    api "androidx.camera:camera-view:$camerax"
}
